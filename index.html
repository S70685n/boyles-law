<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Calculators</title>

<style>
/* ---------- GENERAL ---------- */
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    margin: 0;
    padding: 20px;
}

/* ---------- LOGO ---------- */
.logo-container {
    text-align: center;
    margin-bottom: 20px;
}
.logo-container img {
    max-width: 160px;
}

/* ---------- TABS ---------- */
.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 15px;
}
.tab-button {
    flex: 1;
    background: red;
    color: black;
    border: none;
    padding: 14px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
    transition: background 0.3s;
}
.tab-button.active {
    background: #cc0000;
}

/* ---------- CARD LAYOUT ---------- */
.tab-content {
    display: none;
    background: #fff;
    padding: 20px;
    border-radius: 0 6px 6px 6px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
}
.tab-content.active {
    display: block;
}

/* ---------- FORM ELEMENTS ---------- */
label {
    font-weight: bold;
    display: block;
    margin-bottom: 6px;
}
input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    font-size: 18px;
    border-radius: 4px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

/* ---------- BUTTONS ---------- */
button.calc {
    background: red;
    color: black;
    border: none;
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border-radius: 6px;
    cursor: pointer;
}
button.calc:hover { background: #cc0000; }

button.reset {
    background: #666;
    color: white;
    border: none;
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border-radius: 6px;
    margin-top: 10px;
    cursor: pointer;
}
button.reset:hover { background: #444; }

/* ---------- RESULTS ---------- */
.result {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
}

/* ---------- CARD HEADER ---------- */
.tab-content h2 {
    text-align: center;
    margin-bottom: 6px;
}
.tab-content p.subtitle {
    text-align: center;
    font-size: 14px;
    color: #555;
    margin-bottom: 15px;
}

/* ---------- DIAGRAM BOX ---------- */
.diagram-box {
    width: 100%;
    height: 200px;
    background: #e0e0e0;
    border: 2px solid #999;
    border-radius: 6px;
    margin-bottom: 20px;
    position: relative;
}
.cylinder {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    background: #ddd;
    border: 2px solid red;
    border-radius: 4px;
}
.cylinder-label {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-weight: bold;
    color: #000;
    font-size: 14px;
}

/* ---------- MOBILE RESPONSIVE ---------- */
@media (max-width: 600px){
    .tab-button { font-size: 16px; padding: 10px; }
    input, select { font-size: 16px; padding: 10px; }
    button.calc, button.reset { font-size: 16px; padding: 10px; }
    .diagram-box { height: 150px; }
}
</style>
</head>

<body>

<div class="logo-container">
    <img src="https://eibach.com/storage/img/branding/eibach-main-red.png" alt="Logo">
</div>

<div class="tabs">
    <button class="tab-button active" onclick="openTab(event,'boyle')">Nitrogen Charge Pressure</button>
    <button class="tab-button" onclick="openTab(event,'rod')">Rod Force</button>
    <button class="tab-button" onclick="openTab(event,'cylinder')">Shock Tube Volume</button>
</div>

<!-- ================= NITROGEN CHARGE PRESSURE ================= -->
<div id="boyle" class="tab-content active">
<h2>Nitrogen Charge Pressure</h2>
<p class="subtitle">Leave ONE field blank</p>

<div class="diagram-box" id="boyleDiagram"></div>

<label>Pressure Unit</label>
<select id="pressureUnit">
    <option value="psi">psi</option>
    <option value="bar">bar</option>
</select>

<label>Shock Tube Diameter</label>
<select id="diameter" onchange="updateBoyleDiagram()">
    <option value="2">2.0 inches</option>
    <option value="2.5">2.5 inches</option>
</select>

<label>Derived Radius</label>
<div id="radiusDisplay" style="margin-bottom:14px;font-weight:bold;"></div>

<label>Starting Length V1</label>
<input id="H1" oninput="updateBoyleDiagram()">
<select id="H1Unit" onchange="updateBoyleDiagram()">
    <option value="mm">millimeters</option>
    <option value="in">inches</option>
</select>

<label>Final Length V2</label>
<input id="H2" oninput="updateBoyleDiagram()">
<select id="H2Unit" onchange="updateBoyleDiagram()">
    <option value="mm">millimeters</option>
    <option value="in">inches</option>
</select>

<label>Final Nitrogen Pressure P2</label>
<input id="P2">

<label>Initial Nitrogen Pressure P1</label>
<input id="P1">

<button class="calc" onclick="calculateBoyle()">Calculate</button>
<button class="reset" onclick="resetBoyle()">Reset</button>

<div id="boyleResult" class="result"></div>
</div>

<!-- ================= SHOCK TUBE VOLUME ================= -->
<div id="cylinder" class="tab-content">
<h2>Shock Tube Volume</h2>
<p class="subtitle">Visual cylinder representation</p>

<div class="diagram-box" id="volumeDiagram"></div>

<label>Input Unit</label>
<select id="volInputUnit" onchange="updateVolumeDiagram()">
    <option value="mm">mm</option>
    <option value="in">inches</option>
</select>

<label>Radius</label>
<input id="volRadius" oninput="updateVolumeDiagram()">

<label>Height</label>
<input id="volHeight" oninput="updateVolumeDiagram()">

<label>Output Unit</label>
<select id="volOutputUnit">
    <option value="mm3">mm³</option>
    <option value="L">Liters</option>
</select>

<button class="calc" onclick="calculateVolume()">Calculate</button>
<button class="reset" onclick="resetVolume()">Reset</button>

<div id="volumeResult" class="result"></div>
</div>

<!-- ================= ROD FORCE ================= -->
<div id="rod" class="tab-content">
<h2>Rod Force</h2>

<label>Input Type</label>
<select id="rodType" onchange="updateRodUnits()">
    <option value="force">Rod Force to Nitrogen Pressure</option>
    <option value="pressure">Nitrogen Pressure to Rod Force</option>
</select>

<label>Unit (Verify whether Dyno test is in LBS or Newtons)</label>
<select id="rodUnit"></select>

<label>Value (Rod Force reading on Dyno or Nitrogen pressure specification)</label>
<input id="rodValue">

<label>Shaft Size</label>
<select id="shaft">
    <option value="0.196">1/2 inch</option>
    <option value="0.307" selected>5/8 inch</option>
    <option value="0.601">7/8 inch</option>
</select>

<button class="calc" onclick="calculateRod()">Calculate</button>
<button class="reset" onclick="resetRod()">Reset</button>

<div id="rodResult" class="result"></div>
</div>

<script>
// ---------- Tabs ----------
function openTab(evt, id) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    evt.currentTarget.classList.add('active');
}

// ---------- Boyle’s Law ----------
function heightToMeters(v,u){ return u==="in"?v*0.0254:v/1000; }

function calculateBoyle(){

    let P2v = parseFloat(P2.value);

    let H2v = parseFloat(H2.value);

    let D_in = parseFloat(diameter.value);
    let r_m = (D_in / 2) * 0.0254;
    radiusDisplay.innerText = `Radius = ${(r_m/0.0254).toFixed(3)} inches_
