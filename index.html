<script>
// ---------- Helpers ----------
function heightToMeters(v, u) {
    v = parseFloat(v);
    if (isNaN(v)) return 0;
    return u === "in" ? v * 0.0254 : v / 1000;
}

function animateCylinder(canvas, prevHeight, targetHeight, drawFunc) {
    let startHeight = prevHeight || 0;
    let startTime = null;

    function animate(time) {
        if (!startTime) startTime = time;

        let progress = Math.min((time - startTime) / 500, 1);
        let currentHeight =
            startHeight + (targetHeight - startHeight) * progress;

        drawFunc(currentHeight);

        if (progress < 1) requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
}

// ---------- Boyle's Law ----------
let boylePrevHeights = { v1: 0, v2: 0 };

function calculateBoyle() {
    const P1v = parseFloat(document.getElementById("P1").value);
    const P2v = parseFloat(document.getElementById("P2").value);
    const H1v = parseFloat(document.getElementById("H1").value);
    const H2v = parseFloat(document.getElementById("H2").value);

    const H1Unit = document.getElementById("H1Unit").value;
    const H2Unit = document.getElementById("H2Unit").value;
    const pressureUnit = document.getElementById("pressureUnit").value;

    const diameter = parseFloat(document.getElementById("diameter").value);
    const radiusDisplay = document.getElementById("radiusDisplay");
    const resultBox = document.getElementById("boyleResult");

    let r_m = (diameter / 2) * 0.0254;

    radiusDisplay.innerText = `Radius = ${(r_m / 0.0254).toFixed(3)} inches`;

    let h1m = heightToMeters(H1v, H1Unit);
    let h2m = heightToMeters(H2v, H2Unit);

    let V1 = Math.PI * r_m * r_m * h1m;
    let V2 = Math.PI * r_m * r_m * h2m;

    let blanks = [P1v, P2v, H1v, H2v].filter(v => isNaN(v)).length;

    if (blanks !== 1) {
        resultBox.innerText = "Leave exactly ONE field blank";
        return;
    }

    if (isNaN(P1v)) {
        resultBox.innerText = `P1 = ${(P2v * V2 / V1).toFixed(2)} ${pressureUnit}`;
    } 
    else if (isNaN(P2v)) {
        resultBox.innerText = `P2 = ${(P1v * V1 / V2).toFixed(2)} ${pressureUnit}`;
    } 
    else if (isNaN(H1v)) {
        let H1m = (V2 * P2v) / (Math.PI * r_m * r_m * P1v);
        resultBox.innerText = `H1 = ${(H1m / (H1Unit === "in" ? 0.0254 : 0.001)).toFixed(2)} ${H1Unit}`;
    } 
    else {
        let H2m = (V1 * P1v) / (Math.PI * r_m * r_m * P2v);
        resultBox.innerText = `H2 = ${(H2m / (H2Unit === "in" ? 0.0254 : 0.001)).toFixed(2)} ${H2Unit}`;
    }

    // Animate cylinders
    const canvas = document.getElementById("boyleCanvas");

    animateCylinder(canvas, boylePrevHeights.v1, h1m, (h) => {
        drawBoyleDiagram(r_m, h, h2m);
    });

    animateCylinder(canvas, boylePrevHeights.v2, h2m, (h) => {
        drawBoyleDiagram(r_m, h1m, h);
    });

    boylePrevHeights.v1 = h1m;
    boylePrevHeights.v2 = h2m;
}

function drawBoyleDiagram(radius, h1, h2) {
    const canvas = document.getElementById("boyleCanvas");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let maxHeight = Math.max(h1, h2, 0.001);
    let scale = canvas.height * 0.8 / maxHeight;

    let r_px = radius * 39.37 * 10;
    let x = canvas.width / 2;
    let yOffset = 20;

    // V1
    let grad1 = ctx.createLinearGradient(0, yOffset, 0, yOffset + h1 * scale);
    grad1.addColorStop(0, "#87CEFA");
    grad1.addColorStop(1, "#1E90FF");

    ctx.fillStyle = grad1;
    ctx.fillRect(x - r_px, yOffset, 2 * r_px, h1 * scale);

    // V2
    let grad2 = ctx.createLinearGradient(0, yOffset, 0, yOffset + h2 * scale);
    grad2.addColorStop(0, "#98FB98");
    grad2.addColorStop(1, "#228B22");

    ctx.fillStyle = grad2;
    ctx.fillRect(x + r_px + 20, yOffset, 2 * r_px, h2 * scale);
}

function resetBoyle() {
    ["P1", "P2", "H1", "H2"].forEach(id => {
        document.getElementById(id).value = "";
    });

    document.getElementById("boyleResult").innerText = "";
    document.getElementById("radiusDisplay").innerText = "";

    const ctx = document
        .getElementById("boyleCanvas")
        .getContext("2d");

    ctx.clearRect(0, 0, 400, 300);

    boylePrevHeights = { v1: 0, v2: 0 };
}

// ---------- Shock Tube Volume ----------
function calculateVolume() {
    const r = parseFloat(document.getElementById("volRadius").value);
    const h = parseFloat(document.getElementById("volHeight").value);

    const inputUnit = document.getElementById("volInputUnit").value;
    const outputUnit = document.getElementById("volOutputUnit").value;
    const resultBox = document.getElementById("volumeResult");

    let f = inputUnit === "mm" ? 0.001 : 0.0254;

    let V = Math.PI * (r * f) ** 2 * (h * f);

    let out = outputUnit === "mm3" ? V * 1e9 : V * 1000;

    resultBox.innerText = `Volume = ${out.toFixed(3)} ${outputUnit}`;
}

function resetVolume() {
    document.getElementById("volRadius").value = "";
    document.getElementById("volHeight").value = "";
    document.getElementById("volumeResult").innerText = "";
}

// ---------- Radius helper ----------
function updateRadiusOnly() {
    const D_in = parseFloat(document.getElementById("diameter").value);
    const r_m = (D_in / 2) * 0.0254;

    document.getElementById("radiusDisplay").innerText =
        `Radius = ${(r_m / 0.0254).toFixed(3)} inches`;
}
</script>
