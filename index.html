<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Calculators</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    margin: 0;
    padding: 20px;
}

/* Logo */
.logo-container {
    text-align: center;
    margin-bottom: 20px;
}
.logo-container img {
    max-width: 160px;
}

/* Tabs */
.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 15px;
}
.tab-button {
    flex: 1;
    background: red;
    color: black;
    border: none;
    padding: 14px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
}
.tab-button.active { background: #cc0000; }

/* Tab content */
.tab-content {
    display: none;
    background: #fff;
    padding: 20px;
    border-radius: 0 6px 6px 6px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
}
.tab-content.active { display: block; }

/* Form inputs */
label { font-weight: bold; display: block; margin-bottom: 6px; }
input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    font-size: 18px;
    border-radius: 4px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

/* Buttons */
button.calc {
    background: red;
    color: black;
    border: none;
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border-radius: 6px;
    cursor: pointer;
}
button.calc:hover { background: #cc0000; }
button.reset {
    background: #666;
    color: white;
    border: none;
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border-radius: 6px;
    margin-top: 10px;
    cursor: pointer;
}
button.reset:hover { background: #444; }

/* Result display */
.result { margin-top: 15px; font-size: 20px; font-weight: bold; text-align: center; }
.tab-content h2 { text-align: center; margin-bottom: 6px; }
.tab-content p.subtitle { text-align: center; font-size: 14px; color: #555; margin-bottom: 15px; }

/* Cylinder diagram */
.cylinder-diagram {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}
.cylinder {
    width: 60px;
    height: 200px;
    background: lightgrey;
    border: 2px solid #333;
    position: relative;
}
.cylinder-label {
    position: absolute;
    top: -24px;
    width: 100%;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
}

/* Mobile */
@media (max-width: 600px){
    .tab-button { font-size: 16px; padding: 10px; }
    input, select { font-size: 16px; padding: 10px; }
    button.calc, button.reset { font-size: 16px; padding: 10px; }
}
</style>
</head>
<body>

<div class="logo-container">
    <img src="https://eibach.com/storage/img/branding/eibach-main-red.png" alt="Logo">
</div>

<div class="tabs">
    <button class="tab-button active" onclick="openTab(event,'boyle')">Nitrogen Charge Pressure</button>
    <button class="tab-button" onclick="openTab(event,'rod')">Rod Force</button>
    <button class="tab-button" onclick="openTab(event,'cylinder')">Shock Tube Volume</button>
</div>

<!-- ================= NITROGEN CHARGE PRESSURE ================= -->
<div id="boyle" class="tab-content active">
<h2>Boyle's Law</h2>
<p class="subtitle">Leave ONE field blank</p>

<label>Pressure Unit</label>
<select id="pressureUnit">
    <option value="psi">psi</option>
    <option value="bar">bar</option>
</select>

<label>Shock Tube Diameter</label>
<select id="diameter">
    <option value="2">2.0 inches</option>
    <option value="2.5">2.5 inches</option>
</select>

<label>Derived Radius</label>
<div id="radiusDisplay" style="margin-bottom:14px;font-weight:bold;"></div>

<label>Starting Length of IFP to Bottom of shock tube or Reservoir cap to Reservoir IFP V1 (Select unit of measurement below)</label>
<input id="H1">
<select id="H1Unit">
    <option value="mm">millimeters</option>
    <option value="in">inches</option>
</select>

<label>Final Length of IFP to Bottom of shock tube or Reservoir cap to Reservoir IFP V2 (Select unit of measurement below)</label>
<input id="H2">
<select id="H2Unit">
    <option value="mm">millimeters</option>
    <option value="in">inches</option>
</select>

<label>Final Nitrogen Pressure P2</label>
<input id="P2">

<label>Initial Nitrogen Pressure P1</label>
<input id="P1">

<button class="calc" onclick="calculateBoyle()">Calculate</button>
<button class="reset" onclick="resetBoyle()">Reset</button>

<div id="boyleResult" class="result"></div>

<!-- Cylinder Diagram -->
<div class="cylinder-diagram">
    <div class="cylinder">
        <div class="cylinder-label" id="V1Label">V1 PSI</div>
    </div>
    <div class="cylinder">
        <div class="cylinder-label" id="V2Label">V2 PSI</div>
    </div>
</div>
</div>

<!-- ================= SHOCK TUBE VOLUME ================= -->
<div id="cylinder" class="tab-content">
<h2>Shock Tube Volume</h2>

<label>Input Unit</label>
<select id="volInputUnit">
    <option value="mm">mm</option>
    <option value="in">inches</option>
</select>

<label>Radius</label>
<input id="volRadius">

<label>Height</label>
<input id="volHeight">

<label>Output Unit</label>
<select id="volOutputUnit">
    <option value="mm3">mm³</option>
    <option value="L">Liters</option>
</select>

<button class="calc" onclick="calculateVolume()">Calculate</button>
<button class="reset" onclick="resetVolume()">Reset</button>

<div id="volumeResult" class="result"></div>
</div>

<!-- ================= ROD FORCE ================= -->
<div id="rod" class="tab-content">
<h2>Rod Force</h2>

<label>Input Type</label>
<select id="rodType" onchange="updateRodUnits()">
    <option value="force">Rod Force to Nitrogen Pressure</option>
    <option value="pressure">Nitrogen Pressure to Rod Force</option>
</select>

<label>Unit (Verify whether Dyno test is in LBS or Newtons)</label>
<select id="rodUnit"></select>

<label>Value (Rod Force reading on Dyno or Nitrogen pressure specification)</label>
<input id="rodValue">

<label>Shaft Size</label>
<select id="shaft">
    <option value="0.196">1/2 inch</option>
    <option value="0.307" selected>5/8 inch</option>
    <option value="0.601">7/8 inch</option>
</select>

<button class="calc" onclick="calculateRod()">Calculate</button>
<button class="reset" onclick="resetRod()">Reset</button>

<div id="rodResult" class="result"></div>
</div>

<script>
// Tabs
function openTab(evt, id) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    evt.currentTarget.classList.add('active');
}

// Boyle’s Law
function heightToMeters(v,u){ return u==="in" ? v*0.0254 : v/1000; }

function calculateBoyle(){
    let P1v = parseFloat(P1.value);
    let P2v = parseFloat(P2.value);
    let H1v = parseFloat(H1.value);
    let H2v = parseFloat(H2.value);

    let D_in = parseFloat(diameter.value);
    let r_m = (D_in / 2) * 0.0254;
    radiusDisplay.innerText = `Radius = ${(r_m/0.0254).toFixed(3)} inches`;

    let h1m = heightToMeters(H1v, H1Unit.value);
    let h2m = heightToMeters(H2v, H2Unit.value);

    let V1 = Math.PI * r_m * r_m * h1m;
    let V2 = Math.PI * r_m * r_m * h2m;

    let blanks = [P1v,P2v,H1v,H2v].filter(v=>isNaN(v)).length;
    if(blanks !== 1){
        boyleResult.innerText = "Leave exactly ONE field blank";
        return;
    }

    if(isNaN(P1v)) P1v = P2v*V2/V1;
    else if(isNaN(P2v)) P2v = P1v*V1/V2;
    else if(isNaN(H1v)) H1v = (V2*P2v)/(Math.PI*r_m*r_m*P1v)/(H1Unit.value==="in"?0.0254:0.001);
    else if(isNaN(H2v)) H2v = (V1*P1v)/(Math.PI*r_m*r_m*P2v)/(H2Unit.value==="in"?0.0254:0.001);

    boyleResult.innerText = `P1 = ${P1v.toFixed(2)} ${pressureUnit.value}, P2 = ${P2v.toFixed(2)} ${pressureUnit.value}`;

    // Update cylinder labels
    document.getElementById('V1Label').innerText = `${P1v.toFixed(2)} ${pressureUnit.value}`;
    document.getElementById('V2Label').innerText = `${P2v.toFixed(2)} ${pressureUnit.value}`;
}

function resetBoyle(){
    ["P1","P2","H1","H2"].forEach(id=>document.getElementById(id).value="");
    boyleResult.innerText="";
    radiusDisplay.innerText="";
    document.getElementById('V1Label').innerText="V1 PSI";
    document.getElementById('V2Label').innerText="V2 PSI";
}

// Shock Tube Volume
function calculateVolume(){
    let r=parseFloat(volRadius.value);
    let h=parseFloat(volHeight.value);
    let f = volInputUnit.value==="mm"?0.001:0.0254;
    let V=Math.PI*(r*f)**2*(h*f);
    let out = volOutputUnit.value==="mm3"?V*1e9:V*1000;
    volumeResult.innerText=`Volume = ${out.toFixed(3)} ${volOutputUnit.value}`;
}
function resetVolume(){ volRadius.value=""; volHeight.value=""; volumeResult.innerText=""; }

// Rod Force
function updateRodUnits(){
    rodUnit.innerHTML="";
    if(rodType.value==="force"){
        rodUnit.innerHTML="<option value='lbs'>lbs</option><option value='N'>Newtons</option>";
    } else {
        rodUnit.innerHTML="<option value='psi'>psi</option><option value='bar'>bar</option>";
    }
}
function calculateRod(){
    let v = parseFloat(rodValue.value);
    let f = parseFloat(shaft.value);
    if(isNaN(v)){ rodResult.innerText="Enter a valid value"; return; }

    if(rodType.value==="force"){
        if(rodUnit.value==="N") v *= 0.224809;
        let psi = v/f;
        let bar = psi/14.5038;
        rodResult.innerText = `Pressure = ${psi.toFixed(2)} psi (${bar.toFixed(2)} bar)`;
    } else {
        let psi = (rodUnit.value==="bar")?v*14.5038:v;
        let lbs = psi*f;
        let newtons = lbs/0.224809;
        rodResult.innerText = `Force = ${lbs.toFixed(2)} lbs (${newtons.toFixed(2)} N)`;
    }
}
function resetRod(){ rodValue.value=""; rodResult.innerText=""; }

updateRodUnits();
</script>
</body>
</html>
