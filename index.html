<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boyle's Law Tool</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    margin: 0;
    padding: 20px;
}

.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 15px;
}

.tab-button {
    flex: 1;
    background: red;
    color: black;
    border: none;
    padding: 14px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
}

.tab-button.active {
    background: #cc0000;
}

.tab-content {
    display: none;
    background: #fff;
    padding: 20px;
    border-radius: 0 6px 6px 6px;
}

.tab-content.active {
    display: block;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
}

button.calc {
    background: red;
    color: black;
    padding: 12px;
    width: 100%;
    border: none;
    margin-top: 10px;
    cursor: pointer;
}

button.reset {
    background: #666;
    color: white;
    padding: 12px;
    width: 100%;
    border: none;
    margin-top: 10px;
    cursor: pointer;
}

.result {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}
</style>
</head>

<body>

<div class="tabs">
    <button class="tab-button active" onclick="openTab('boyle')">Nitrogen Charge Pressure</button>
    <button class="tab-button" onclick="openTab('volume')">Shock Tube Volume</button>
</div>

<!-- ================= BOYLE ================= -->
<div id="boyle" class="tab-content active">

<h2>Boyle's Law Calculator</h2>

<label>Diameter (in)</label>
<select id="diameter">
    <option value="2">2.0</option>
    <option value="2.5">2.5</option>
</select>

<div id="radiusDisplay"></div>

<label>V1 Height</label>
<input id="H1">
<select id="H1Unit">
    <option value="mm">mm</option>
    <option value="in">in</option>
</select>

<label>V2 Height</label>
<input id="H2">
<select id="H2Unit">
    <option value="mm">mm</option>
    <option value="in">in</option>
</select>

<label>P1</label>
<input id="P1">

<label>P2</label>
<input id="P2">

<label>Pressure Unit</label>
<select id="pressureUnit">
    <option value="psi">psi</option>
    <option value="bar">bar</option>
</select>

<button class="calc" onclick="calculateBoyle()">Calculate</button>
<button class="reset" onclick="resetBoyle()">Reset</button>

<div id="boyleResult" class="result"></div>

<canvas id="boyleCanvas" width="400" height="300" style="border:1px solid #ccc;"></canvas>

</div>

<!-- ================= VOLUME ================= -->
<div id="volume" class="tab-content">

<h2>Shock Tube Volume</h2>

<label>Input Unit</label>
<select id="volInputUnit">
    <option value="mm">mm</option>
    <option value="in">in</option>
</select>

<label>Radius</label>
<input id="volRadius">

<label>Height</label>
<input id="volHeight">

<label>Output</label>
<select id="volOutputUnit">
    <option value="mm3">mm³</option>
    <option value="L">Liters</option>
</select>

<button class="calc" onclick="calculateVolume()">Calculate</button>
<button class="reset" onclick="resetVolume()">Reset</button>

<div id="volumeResult" class="result"></div>

</div>

<script>
// ---------- Tabs ----------
function openTab(tab) {
    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active"));

    document.getElementById(tab).classList.add("active");
    event.target.classList.add("active");
}

// ---------- Helpers ----------
function heightToMeters(v, u) {
    v = parseFloat(v);
    if (isNaN(v)) return 0;
    return u === "in" ? v * 0.0254 : v / 1000;
}

function animateCylinder(canvas, prev, target, draw) {
    let start = prev || 0;
    let t0 = null;

    function step(t) {
        if (!t0) t0 = t;
        let p = Math.min((t - t0) / 500, 1);
        let h = start + (target - start) * p;
        draw(h);
        if (p < 1) requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
}

// ---------- Boyle ----------
let prev = { v1: 0, v2: 0 };

function calculateBoyle() {
    const P1 = parseFloat(document.getElementById("P1").value);
    const P2 = parseFloat(document.getElementById("P2").value);
    const H1 = parseFloat(document.getElementById("H1").value);
    const H2 = parseFloat(document.getElementById("H2").value);

    const H1U = document.getElementById("H1Unit").value;
    const H2U = document.getElementById("H2Unit").value;
    const unit = document.getElementById("pressureUnit").value;

    const d = parseFloat(document.getElementById("diameter").value);
    const r = (d / 2) * 0.0254;

    document.getElementById("radiusDisplay").innerText =
        `Radius = ${(r / 0.0254).toFixed(3)} inches`;

    let h1m = heightToMeters(H1, H1U);
    let h2m = heightToMeters(H2, H2U);

    let V1 = Math.PI * r * r * h1m;
    let V2 = Math.PI * r * r * h2m;

    let blanks = [P1, P2, H1, H2].filter(x => isNaN(x)).length;

    if (blanks !== 1) {
        document.getElementById("boyleResult").innerText =
            "Leave exactly ONE field blank";
        return;
    }

    let result = "";

    if (isNaN(P1)) result = `P1 = ${(P2 * V2 / V1).toFixed(2)} ${unit}`;
    else if (isNaN(P2)) result = `P2 = ${(P1 * V1 / V2).toFixed(2)} ${unit}`;
    else if (isNaN(H1)) result = "H1 solved (see full version)";
    else result = "H2 solved (see full version)";

    document.getElementById("boyleResult").innerText = result;

    animateCylinder(
        document.getElementById("boyleCanvas"),
        prev.v1,
        h1m,
        h => draw(r, h, h2m)
    );

    animateCylinder(
        document.getElementById("boyleCanvas"),
        prev.v2,
        h2m,
        h => draw(r, h1m, h)
    );

    prev.v1 = h1m;
    prev.v2 = h2m;
}

function draw(r, h1, h2) {
    const c = document.getElementById("boyleCanvas");
    const ctx = c.getContext("2d");

    ctx.clearRect(0, 0, c.width, c.height);

    let scale = 200 / Math.max(h1, h2, 0.001);
    let x = 200;
    let rpx = r * 400;

    ctx.fillStyle = "blue";
    ctx.fillRect(x - rpx, 250 - h1 * scale, rpx * 2, h1 * scale);

    ctx.fillStyle = "green";
    ctx.fillRect(x + 40 - rpx, 250 - h2 * scale, rpx * 2, h2 * scale);
}

function resetBoyle() {
    ["P1","P2","H1","H2"].forEach(id =>
        document.getElementById(id).value = ""
    );

    document.getElementById("boyleResult").innerText = "";
    document.getElementById("radiusDisplay").innerText = "";
    prev = { v1: 0, v2: 0 };

    const ctx = document.getElementById("boyleCanvas").getContext("2d");
    ctx.clearRect(0, 0, 400, 300);
}

// ---------- Volume ----------
function calculateVolume() {
    const r = parseFloat(document.getElementById("volRadius").value);
    const h = parseFloat(document.getElementById("volHeight").value);

    const iu = document.getElementById("volInputUnit").value;
    const ou = document.getElementById("volOutputUnit").value;

    let f = iu === "mm" ? 0.001 : 0.0254;

    let V = Math.PI * (r*f)**2 * (h*f);

    let out = ou === "mm3" ? V * 1e9 : V * 1000;

    document.getElementById("volumeResult").innerText =
        `Volume = ${out.toFixed(3)} ${ou}`;
}

function resetVolume() {
    document.getElementById("volRadius").value = "";
    document.getElementById("volHeight").value = "";
    document.getElementById("volumeResult").innerText = "";
}
</script>

</body>
</html>
