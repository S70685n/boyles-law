<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boyle's Law Tool</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    margin: 0;
    padding: 20px;
}

.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 15px;
}

.tab-button {
    flex: 1;
    background: red;
    color: black;
    border: none;
    padding: 14px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
}

.tab-button.active {
    background: #cc0000;
}

.tab-content {
    display: none;
    background: #fff;
    padding: 20px;
    border-radius: 0 6px 6px 6px;
}

.tab-content.active {
    display: block;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
}

button.calc {
    background: red;
    color: black;
    padding: 12px;
    width: 100%;
    border: none;
    margin-top: 10px;
    cursor: pointer;
}

button.reset {
    background: #666;
    color: white;
    padding: 12px;
    width: 100%;
    border: none;
    margin-top: 10px;
    cursor: pointer;
}

.result {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}
</style>
</head>

<body>

<div class="tabs">
    <button class="tab-button active" onclick="openTab('boyle')">Nitrogen Charge Pressure</button>
    <button class="tab-button" onclick="openTab('volume')">Shock Tube Volume</button>
</div>

<!-- ================= BOYLE ================= -->
<div id="boyle" class="tab-content active">

<h2>Boyle's Law Calculator</h2>

<label>Diameter (in)</label>
<select id="diameter">
    <option value="2">2.0</option>
    <option value="2.5">2.5</option>
</select>

<div id="radiusDisplay"></div>

<label>V1 Height</label>
<input id="H1">
<select id="H1Unit">
    <option value="mm">mm</option>
    <option value="in">in</option>
</select>

<label>V2 Height</label>
<input id="H2">
<select id="H2Unit">
    <option value="mm">mm</option>
    <option value="in">in</option>
</select>

<label>P1</label>
<input id="P1">

<label>P2</label>
<input id="P2">

<label>Pressure Unit</label>
<select id="pressureUnit">
    <option value="psi">psi</option>
    <option value="bar">bar</option>
</select>

<button class="calc" onclick="calculateBoyle()">Calculate</button>
<button class="reset" onclick="resetBoyle()">Reset</button>

<div id="boyleResult" class="result"></div>

<canvas id="boyleCanvas" width="400" height="300" style="border:1px solid #ccc;"></canvas>

</div>

<!-- ================= VOLUME ================= -->
<div id="volume" class="tab-content">

<h2>Shock Tube Volume</h2>

<label>Input Unit</label>
<select id="volInputUnit">
    <option value="mm">mm</option>
    <option value="in">in</option>
</select>

<label>Radius</label>
<input id="volRadius">

<label>Height</label>
<input id="volHeight">

<label>Output</label>
<select id="volOutputUnit">
    <option value="mm3">mm³</option>
    <option value="L">Liters</option>
</select>

<button class="calc" onclick="calculateVolume()">Calculate</button>
<button class="reset" onclick="resetVolume()">Reset</button>

<div id="volumeResult" class="result"></div>

</div>

<script>

// ---------- Helpers ----------
function heightToMeters(v,u){
    return u==="in"?v*0.0254:v/1000;
}

function animateCylinder(canvas,prevHeight,targetHeight,drawFunc){
    let startHeight=prevHeight||0;
    let startTime=null;

    function animate(time){
        if(!startTime) startTime=time;
        let progress=Math.min((time-startTime)/500,1);
        let currentHeight=startHeight+(targetHeight-startHeight)*progress;
        drawFunc(currentHeight);
        if(progress<1) requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
}

// ---------- Boyle's Law ----------
let boylePrevHeights={v1:0,v2:0};

function calculateBoyle(){

    let P1v=parseFloat(document.getElementById("P1").value);
    let P2v=parseFloat(document.getElementById("P2").value);
    let H1v=parseFloat(document.getElementById("H1").value);
    let H2v=parseFloat(document.getElementById("H2").value);

    let D_in=parseFloat(document.getElementById("diameter").value);

    let H1Unit=document.getElementById("H1Unit").value;
    let H2Unit=document.getElementById("H2Unit").value;
    let pressureUnit=document.getElementById("pressureUnit").value;

    let radiusDisplay=document.getElementById("radiusDisplay");
    let boyleResult=document.getElementById("boyleResult");

    let r_m=(D_in/2)*0.0254;

    radiusDisplay.innerText=`Radius = ${(r_m/0.0254).toFixed(3)} inches`;

    let h1m=heightToMeters(H1v,H1Unit);
    let h2m=heightToMeters(H2v,H2Unit);

    let V1=Math.PI*r_m*r_m*h1m;
    let V2=Math.PI*r_m*r_m*h2m;

    let blanks=[P1v,P2v,H1v,H2v].filter(v=>isNaN(v)).length;

    if(blanks!==1){
        boyleResult.innerText="Leave exactly ONE field blank";
        return;
    }

    if(isNaN(P1v))
        boyleResult.innerText=`P1 = ${(P2v*V2/V1).toFixed(2)} ${pressureUnit}`;

    else if(isNaN(P2v))
        boyleResult.innerText=`P2 = ${(P1v*V1/V2).toFixed(2)} ${pressureUnit}`;

    else if(isNaN(H1v))
        boyleResult.innerText=`H1 = ${((V2*P2v)/(Math.PI*r_m*r_m*P1v)/(H1Unit==="in"?0.0254:0.001)).toFixed(2)} ${H1Unit}`;

    else
        boyleResult.innerText=`H2 = ${((V1*P1v)/(Math.PI*r_m*r_m*P2v)/(H2Unit==="in"?0.0254:0.001)).toFixed(2)} ${H2Unit}`;


    // Animate cylinders (UNCHANGED LOGIC)
    let canvas=document.getElementById("boyleCanvas");

    animateCylinder(canvas,boylePrevHeights.v1,h1m,h=>drawBoyleDiagram(r_m,h,h2m));
    animateCylinder(canvas,boylePrevHeights.v2,h2m,h=>drawBoyleDiagram(r_m,h1m,h));

    boylePrevHeights.v1=h1m;
    boylePrevHeights.v2=h2m;
}

// ---------- DRAW (UNCHANGED VISUAL IDEA) ----------
function drawBoyleDiagram(radius,h1,h2){

    let canvas=document.getElementById("boyleCanvas");
    let ctx=canvas.getContext("2d");

    ctx.clearRect(0,0,canvas.width,canvas.height);

    let maxHeight=Math.max(h1,h2);
    if(maxHeight===0) return;

    let scale=canvas.height*0.8/maxHeight;

    let r_px=radius*39.37*10;
    let x=canvas.width/2;
    let yOffset=20;

    // V1
    let grad1=ctx.createLinearGradient(0,yOffset,0,yOffset+h1*scale);
    grad1.addColorStop(0,"#87CEFA");
    grad1.addColorStop(1,"#1E90FF");

    ctx.fillStyle=grad1;
    ctx.fillRect(x-r_px,yOffset,2*r_px,h1*scale);

    // V2
    let grad2=ctx.createLinearGradient(0,yOffset,0,yOffset+h2*scale);
    grad2.addColorStop(0,"#98FB98");
    grad2.addColorStop(1,"#228B22");

    ctx.fillStyle=grad2;
    ctx.fillRect(x+r_px+20,yOffset,2*r_px,h2*scale);
}

function resetBoyle(){

    ["P1","P2","H1","H2"].forEach(id=>{
        document.getElementById(id).value="";
    });

    document.getElementById("boyleResult").innerText="";
    document.getElementById("radiusDisplay").innerText="";

    let ctx=document.getElementById("boyleCanvas").getContext("2d");
    ctx.clearRect(0,0,400,300);

    boylePrevHeights={v1:0,v2:0};
}

// ---------- SHOCK TUBE VOLUME (UNCHANGED MATH) ----------
function calculateVolume(){

    let r=parseFloat(document.getElementById("volRadius").value);
    let h=parseFloat(document.getElementById("volHeight").value);

    let f=document.getElementById("volInputUnit").value==="mm"?0.001:0.0254;

    let V=Math.PI*(r*f)**2*(h*f);

    let out=document.getElementById("volOutputUnit").value==="mm3"
        ?V*1e9
        :V*1000;

    document.getElementById("volumeResult").innerText=
        `Volume = ${out.toFixed(3)} ${document.getElementById("volOutputUnit").value}`;
}

function resetVolume(){
    document.getElementById("volRadius").value="";
    document.getElementById("volHeight").value="";
    document.getElementById("volumeResult").innerText="";
}

// ---------- Radius ONLY helper (UNCHANGED LOGIC) ----------
function updateRadiusOnly(){

    let D_in=parseFloat(document.getElementById("diameter").value);
    let r_m=(D_in/2)*0.0254;

    document.getElementById("radiusDisplay").innerText=
        `Radius = ${(r_m/0.0254).toFixed(3)} inches`;
}

</script>
    
</body>
</html>
